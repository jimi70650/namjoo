const SUPABASE_URL = 'https://prsklpttxaqslhysuxtf.supabase.co/rest/v1/';
const SUPABASE_ANON_KEY = 'sb_publishable_ljWdV0BKwjT2R14vSNcZfg_gbFiFNFq';
<script>
const SUPABASE_URL = 'https://YOUR-PROJECT-REF.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';

const API = `${SUPABASE_URL}/rest/v1/names`;

let page = 1;
let timer;
let DEMO = [];

/* دریافت نام‌ها از Supabase */
async function loadNames() {
  try {
    const response = await fetch(
      `${API}?select=slug,name,latin_name,country_name,language_name&limit=1000`,
      {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error(`Supabase error: ${response.status}`);
    }

    DEMO = await response.json();

    console.log(`Loaded ${DEMO.length} names from Supabase`);

    fillLocal();

  } catch (error) {
    console.error('Supabase connection failed:', error);
    DEMO = [];
  }
}

/* جستجوی محلی */
function localFilter() {
  const q = $('q').value.trim().toLowerCase();
  const c = $('country').value;
  const l = $('language').value;

  return DEMO.filter(x => {
    const text = [
      x.name,
      x.latin_name,
      x.meaning,
      x.country_name,
      x.language_name
    ].filter(Boolean).join(' ').toLowerCase();

    return (
      (!q || text.includes(q)) &&
      (!c || x.country_name === c) &&
      (!l || x.language_name === l)
    );
  });
}

/* پر کردن فیلتر کشور و زبان */
function fillLocal() {

  const country = $('country');

  if (country) {
    [...new Set(
      DEMO
        .map(x => x.country_name)
        .filter(Boolean)
    )]
    .sort()
    .forEach(v => {
      country.insertAdjacentHTML(
        'beforeend',
        `<option value="${v}">${v}</option>`
      );
    });
  }

  const language = $('language');

  if (language) {
    [...new Set(
      DEMO
        .map(x => x.language_name)
        .filter(Boolean)
    )]
    .sort()
    .forEach(v => {
      language.insertAdjacentHTML(
        'beforeend',
        `<option value="${v}">${v}</option>`
      );
    });
  }
}

/* شروع اتصال */
loadNames();
</script>
